[package]
name = "alpinium"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A configurable Wayland compositor for KhaymOS"
license = "MIT"
repository = "https://github.com/Khaymos/Alpinium"

[[bin]]
name = "alpinium"
path = "src/main.rs"

[dependencies]
bitflags = "2.2.1"
smithay = { version = "=0.7.0", default-features = false, features = ["backend_winit", "backend_drm", "backend_gbm", "backend_libinput", "backend_udev", "backend_session_libseat", "renderer_gl", "wayland_frontend", "desktop"] }
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
smithay-drm-extras = { version = "=0.1.0", default-features = false }
xcursor = "=0.3.11"

[dev-dependencies]
tempfile = "3.27"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
