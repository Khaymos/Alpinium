# Default Alpinium configuration.
# Installed by KhaymOS to /etc/alpinium/config.
# Users can override this file at ~/.config/alpinium/config.

# Define reusable values. Mod4 is the Super/Windows key.
set $mod Mod4
set $terminal alacritty

# Select one global window-management mode: tiling or floating.
mode tiling

# Visual effects shared by both modes.
animations enabled
animation_duration 200ms
animation_curve ease-out
window_move_animation enabled
window_resize_animation enabled
shadows enabled
corner_radius 8

# Window spacing (pixels).
gaps inner 5
gaps outer 5

# Keyboard shortcuts. Commands run through the user's shell.
bindsym $mod+Return exec $terminal
bindsym $mod+Tab focus next
bindsym $mod+Shift+Tab focus prev
bindsym $mod+q kill
bindsym $mod+Shift+e exit

bindsym $mod+Shift+space floating toggle

bindsym $mod+Shift+f floating toggle

# Optional desktop wallpaper (PNG, JPEG, or WebP).
# Paths may be quoted when they contain spaces.
wallpaper /home/yaffs2/Downloads/DSCN0145.png
wallpaper_mode fill
