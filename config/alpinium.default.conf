# Default Alpinium configuration.
# Installed by KhaymOS to /etc/alpinium/config.
# Users can override this file at ~/.config/alpinium/config.

# Select one global window-management mode: tiling or floating.
mode tiling

# Visual effects shared by both modes.
animations enabled
animation_duration 200ms
shadows enabled
corner_radius 8

# Window spacing (pixels).
gaps inner 5
gaps outer 5
